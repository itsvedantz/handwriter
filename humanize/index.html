<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Humanizer & Text Paraphraser Tool</title>
    <!-- Additional Tags -->
    <link rel="canonical" href="https://zayuvalya.github.io/AI-Text-Humanizer/" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/scrollreveal"></script>
</head>

<body>
    <div class="container">
        <header>
            <div class="back-home-container" style="text-align: left; padding-left: -10px;">
                <a href="../home.html" style="color: #ffffff; text-decoration: underline; background: none; border: none; padding: 0; font-weight: normal;"><strong>Back to Home</strong></a>
            </div>
            <h1 class="logo">AI Humanizer & Text Paraphraser Tool</h1>
            <p class="tagline">Transform AI-generated content into natural, human-like writing</p>
        </header>
        
        <main>
            <div class="card">
                <h2 class="card-title"><i class="fas fa-keyboard"></i> Input Text</h2>
                <div class="input-group">
                    <textarea id="ai-input" placeholder="Paste your AI-generated text here..." maxlength="5000"></textarea>
                    <div id="char-count" class="char-count">0/5000 characters</div>
                    <button id="humanize-btn" class="btn">
                        <span>Humanize Text</span>
                        <div id="spinner" class="spinner"></div>
                    </button>
                </div>
            </div>
            
            <div class="card">
                <h2 class="card-title"><i class="fas fa-file-alt"></i> Humanized Output</h2>
                <div class="output-container">
                    <textarea id="human-output" placeholder="Your humanized text will appear here..." readonly></textarea>
                    <div class="output-actions">
                        <button id="copy-btn" class="btn btn-secondary" title="Copy to clipboard">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <footer style="display:none;">
            <p id="current-year-container">&copy; <span id="current-year"></span></p>
            <p><a href="zayuvalya.github.io"></a>.</p>
        </footer>
    </div>
    
    <div id="notification" class="notification">
        <i class="fas fa-check-circle"></i>
        <span>Text copied to clipboard!</span>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
